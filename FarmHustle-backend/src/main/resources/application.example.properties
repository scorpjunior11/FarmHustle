spring.application.name=farmhustle-backend

spring.datasource.url=jdbc:postgresql://localhost:5432/FarmHustle
spring.datasource.username=postgres
spring.datasource.password=YOUR_POSTGRES_PASSWORD
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

server.port=8080

jwt.secret=YOUR_LONG_RANDOM_JWT_SECRET_BASE64
jwt.expiration=604800000

brevo.api.key=YOUR_BREVO_API_KEY
brevo.sender.email=YOUR_BREVO_VERIFIED_SENDER_EMAIL

# Selects which EmailService bean is active: "gmail" or "brevo".
# To revert to Brevo, change this single line to email.provider=brevo.
email.provider=gmail

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=YOUR_GMAIL_ADDRESS
spring.mail.password=YOUR_GMAIL_APP_PASSWORD
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000