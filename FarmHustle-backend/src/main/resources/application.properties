spring.application.name=farmhustle-backend

spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

server.port=8080

# Gates the multi-driver negotiation endpoints only (/api/negotiation/**).
# The existing simple provider-proposes flow (/api/deliveries/**) is never
# gated by this and stays fully functional in either state.
negotiation.enabled=${NEGOTIATION_ENABLED:false}

paystack.secret.key=${PAYSTACK_SECRET_KEY}

jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION}

brevo.api.key=${BREVO_API_KEY}
brevo.sender.email=${BREVO_SENDER_EMAIL}

# Selects which EmailService bean is active: "gmail" or "brevo".
# To revert to Brevo, change this single line to email.provider=brevo.
email.provider=brevo

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${GMAIL_USERNAME}
spring.mail.password=${GMAIL_APP_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000